name: Release VoiceFlow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows x64
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The tag, package.json and tauri.conf.json must agree, or the updater
      # would advertise a different version than the one installed.
      - name: Check version and read release notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Run: pnpm release:version ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          {
            echo "RELEASE_NOTES<<__NOTES__"
            node scripts/release-notes.mjs "${version}"
            echo "__NOTES__"
          } >> "$GITHUB_ENV"

      # The wake word engine's DLLs are downloaded into target/release by
      # this build; tauri.dlls.conf.json then ships them next to the app.
      # That file's resources replace tauri.conf.json's, so it repeats the
      # wake word model too.
      - name: Fetch the wake word engine
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        with:
          args: --config src-tauri/tauri.dlls.conf.json
          tagName: v__VERSION__
          releaseName: VoiceFlow v__VERSION__
          # Shown on the GitHub release page and in the app's update dialog.
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
